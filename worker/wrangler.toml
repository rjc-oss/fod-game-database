name = "fod-saves"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
GITHUB_REPO = "rjc-oss/fod-game-database"
MAX_BODY_BYTES = "4000000"

[[kv_namespaces]]
binding = "INCOMING"
id = "1d239e3d6af5454a99002e519299ce16"

# Rate limiting binding. The spec's [[ratelimits]] key is not what wrangler
# currently accepts; this is the documented form. index.js skips rate limiting
# (with a log line) if the binding is missing, so a syntax change here cannot
# take the endpoint down.
[[unsafe.bindings]]
name = "UPLOAD_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
